<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Night Ferry — HD pixel test</title><style>body{margin:0;background:#111}</style></head>
<body>
<script src="hd_engine.js"></script>
<script>
'use strict';
// One test frame of Night Ferry as real pixel art at 360 x 640: shapes drawn pixel by pixel in colour steps,
// light from the moon, the lanterns and the spirits themselves, fog as hand-placed pixel patterns.
const e = Engine();
e.setAmbient(-1);
const r = rng(7);
const WL = 352;
// sky
for (let y = 0; y < WL; y++) for (let x = 0; x < PW; x++) { const t = y / WL; e.put(x, y, 'night', Math.min(5, Math.floor(0.6 + t * 3.6 + bay(x, y) * 0.95))); }
for (let i = 0; i < 140; i++) { const x = r() * PW, y = r() * 280; e.put(x, y, 'white', r() < 0.15 ? 5 : 3, 0, 1); if (r() < 0.06) { e.put(x + 1, y, 'white', 3, 0, 1); e.put(x - 1, y, 'white', 3, 0, 1); e.put(x, y + 1, 'white', 3, 0, 1); e.put(x, y - 1, 'white', 3, 0, 1); } }
// moon
e.ell(272, 112, 21, 21, 'cream', (px, py, nx, ny) => (Math.hypot(px - 265, py - 106) < 5 || Math.hypot(px - 280, py - 120) < 3.5 || Math.hypot(px - 276, py - 101) < 2.5 ? 3 : nx > 0.55 ? 4 : 5), 0, 1);
e.light(272, 112, 95, 2.2);
// far mountains and the pine ridge
for (let x = 0; x < PW; x++) { const h = 300 - Math.abs(Math.sin(x * 0.012 + 1)) * 46 - Math.sin(x * 0.05) * 6; for (let y = Math.floor(h); y < WL; y++) e.put(x, y, 'stone', y < h + 2 ? 3 : 2); }
for (let x = 0; x < PW; x++) { const h = 326 - Math.sin(x * 0.03 + 2) * 8; for (let y = Math.floor(h); y < WL; y++) e.put(x, y, 'pine', 1); }
for (let i = 0; i < 70; i++) { const x = i * 5.3 + r() * 3, base = 326 - Math.sin(x * 0.03 + 2) * 8, h = 8 + r() * 16; e.poly([[x, base - h], [x - h * 0.3, base + 1], [x + h * 0.3, base + 1]], 'pine', (px) => (px < x ? 2 : 1)); }
// mist: hand-placed dither bands, thicker near the water
const mist = (y0, y1, peak, sh) => { for (let y = y0; y < y1; y++) { const k = 1 - Math.abs((y - (y0 + y1) / 2) / ((y1 - y0) / 2)); for (let x = 0; x < PW; x++) { const wob = Math.sin(x * 0.04 + y * 0.2) * 0.15; if (bay(x, y) < (k + wob) * peak) e.put(x, y, 'fog', sh); } } };
mist(300, 340, 0.55, 3); mist(326, 360, 0.8, 4);
// water: bands, ripples and the moon's path
for (let y = WL; y < PH; y++) for (let x = 0; x < PW; x++) {
  const d = (y - WL) / (PH - WL);
  const ramp = d < 0.12 ? 'water' : 'deep';
  const sh = d < 0.04 ? 3 : d < 0.12 ? 2 : Math.max(0, 4 - Math.floor(d * 5 + bay(x, y) * 0.9));
  e.put(x, y, ramp, sh);
}
for (let i = 0; i < 60; i++) { const y = WL + 2 + Math.floor(r() * 40), x = r() * PW, w = 3 + Math.floor(r() * 8); e.rect(x, y, w, 1, 'water', 4); }
for (let i = 0; i < 16; i++) { const y = WL + 3 + i * 3, w = 6 + i * 1.5 + r() * 6; e.rect(272 - w / 2 + (r() - 0.5) * 6, y, w, 1, 'cream', 4 - Math.floor(i / 6), 0, 1); }
// weeds below
for (let i = 0; i < 34; i++) { const x = r() * PW, h = 40 + r() * 120, sw = (r() - 0.5) * 20; for (let k = 0; k < h; k++) { const t = k / h; e.put(x + sw * t * t, PH - k, 'pine', 1 + (k % 9 === 0 ? 1 : 0)); } }
// the Deep One: a dark mass with a pale eye
e.ell(88, 520, 86, 64, 'deep', (px, py, nx, ny) => (ny < -0.6 && nx > 0 ? 3 : bay(px, py) < 0.4 ? 1 : 2), 9);
for (let k = 0; k < 4; k++) { const a = -2.4 + k * 0.45; for (let s = 0; s < 70; s++) { const t = s / 70; e.put(88 + Math.cos(a) * (70 + s) + Math.sin(t * 5) * 6, 520 + Math.sin(a) * (54 + s * 0.8), 'deep', 2); e.put(89 + Math.cos(a) * (70 + s) + Math.sin(t * 5) * 6, 520 + Math.sin(a) * (54 + s * 0.8), 'deep', 2); } }
e.ell(96, 492, 20, 11, 'cream', (px, py, nx, ny) => (ny < -0.4 ? 5 : ny > 0.5 ? 3 : 4), 9, 1);
e.ell(92, 492, 3, 10, 'raven', 0, 9, 1);
e.light(96, 492, 44, 1.6);
for (let i = 0; i < 9; i++) { const x = 70 + r() * 70, y = 360 + r() * 110; e.ell(x, y, 2, 2, 'water', 4); e.put(x, y, 'deep', 1); }
// ---- the boat, tilted a little ----
const ang = -0.08, bx = 180, by = WL + 2;
const R = (x, y) => [bx + x * Math.cos(ang) - y * Math.sin(ang), by + x * Math.sin(ang) + y * Math.cos(ang)];
// the toad boatman (drawn before the hull so the hull hides his feet)
const tx = 60, ty = -10;
const T = (dx, dy) => R(tx + dx, ty + dy);
const tell = (dx, dy, rx, ry, ramp, sh) => { const [x, y] = T(dx, dy); e.ell(x, y, rx, ry, ramp, sh, 2); };
tell(-2, -16, 17, 15, 'toad'); tell(5, -12, 10, 10, 'belly', (px, py, nx, ny) => 4 - Math.round(ny * 1.2));
tell(7, -33, 15, 11, 'toad'); tell(9, -27, 11, 4, 'belly', 4);
e.line(...T(-2, -28), ...T(19, -29), 'toad', 0, 1, 2);
tell(1, -43, 5, 5, 'toad'); tell(13, -43, 5, 5, 'toad');
tell(2, -43, 3, 3, 'cream', 5); tell(14, -43, 3, 3, 'cream', 5);
e.put(...T(3, -43), 'raven', 0, 2); e.put(...T(15, -43), 'raven', 0, 2);
e.rect(...T(-2, -46), 7, 2, 'toad', 3, 2); e.rect(...T(10, -46), 7, 2, 'toad', 3, 2); // sleepy lids
const hat = [T(-14, -48), T(28, -48), T(24, -45), T(-10, -45)]; e.poly(hat, 'straw', (px, py) => 3 + (px % 4 === 0 ? 1 : 0), 2);
e.ell(...T(7, -53), 10, 6, 'straw', (px, py, nx, ny) => (ny > 0.5 ? 2 : (px + py) % 3 === 0 ? 4 : 3), 2);
e.rect(...T(-2, -50), 18, 2, 'red', 3, 2);
tell(-14, -4, 8, 5, 'toad'); tell(14, -6, 5, 4, 'toad');
e.line(...T(16, -18), ...T(30, -44), 'wood', 2, 2, 2);
e.outline(2);
// lantern on his stick
const lantern = (x, y, id) => { e.line(x, y - 4, x, y, 'raven', 1, 1); e.rect(x - 5, y, 11, 2, 'raven', 2, id); e.rect(x - 4, y + 2, 9, 10, 'fire', (px, py) => (Math.abs(px - x) < 2 && py > y + 4 ? 5 : px < x - 2 ? 3 : 4), id, 1); e.rect(x - 4, y + 2, 1, 10, 'raven', 2, id); e.rect(x + 4, y + 2, 1, 10, 'raven', 2, id); e.rect(x - 5, y + 12, 11, 2, 'raven', 2, id); e.glow(x, y + 7, 26, 'rgba(255,190,100,A)', 0.45); e.glow(x, y + 7, 8, 'rgba(255,240,190,A)', 0.7); };
const [lx, ly] = T(30, -46); lantern(lx, ly + 2, 3);
e.light(lx, ly + 9, 90, 3.2, 'rgba(255,170,80,A)');
// the spirits, each its own little light
const SP = [['sp1', -78, 9], ['sp2', -56, 11], ['sp3', -30, 14], ['sp4', -4, 10], ['sp5', 20, 9]];
SP.forEach(([ramp, u, rad], i) => {
  const [x, y] = R(u, -10 - rad * 0.8);
  e.ell(x, y, rad, rad * 0.92, ramp, (px, py, nx, ny) => Math.min(5, 3 + Math.round((-nx * 0.5 - ny * 0.9) * 1.6)), 10 + i, 1);
  e.outline(10 + i);
  // eyes: the green one is worried, the rest content
  if (i === 2) { e.ell(x - 3, y - 2, 2.2, 2.6, 'white', 5, 0, 1); e.ell(x + 4, y - 2, 2.2, 2.6, 'white', 5, 0, 1); e.put(x - 3, y - 2, 'raven', 0, 0, 1); e.put(x + 4, y - 2, 'raven', 0, 0, 1); e.rect(x, y + 3, 2, 2, 'raven', 1, 0, 1); }
  else { e.rect(x - 3, y - 2, 1, 2, 'raven', 1, 0, 1); e.rect(x + 2, y - 2, 1, 2, 'raven', 1, 0, 1); }
  e.light(x, y, rad * 3.2, 1.6);
});
// hull, planks, rim light, stern pole with its lantern
const hull = [[-122, -10], [-60, -6], [60, -6], [124, -14], [118, 2], [96, 20], [60, 26], [-60, 26], [-96, 22], [-116, 6]].map(([x, y]) => R(x, y));
e.poly(hull, 'wood', (px, py) => { const [ox, oy] = [px - bx, py - by]; const ly2 = -ox * Math.sin(ang) + oy * Math.cos(ang); if (ly2 < -6) return 4; if (Math.round(ly2) % 6 === 0) return 1; return ly2 < 4 ? 3 : 2; }, 4);
e.outline(4);
e.line(...R(-118, -12), ...R(122, -16), 'cream', 3, 1);
e.line(...R(-112, -10), ...R(-118, -72), 'wood', 2, 2); e.line(...R(-118, -72), ...R(-100, -74), 'wood', 2, 2);
const [sx, sy] = R(-100, -66); lantern(sx, sy, 5); e.light(sx, sy + 5, 80, 3, 'rgba(255,170,80,A)');
for (let y = WL + 4; y < WL + 34; y++) for (let x = 40; x < 320; x++) {
  const cur = e.get(x, y); if (cur === null || cur !== RI.wood) continue;
  if (bay(x, y) < 0.5 + (y - WL - 4) / 60) e.put(x, y, 'water', y < WL + 8 ? 3 : 2);
}
for (let x = 52; x < 312; x++) if ((x >> 1) % 3) e.put(x, WL + 4 + Math.round(Math.sin(x * 0.2)), 'water', 5);
// fireflies and a splash ring
for (let i = 0; i < 12; i++) { const x = 20 + r() * 320, y = 220 + r() * 110; e.put(x, y, 'gold', 5, 0, 1); e.light(x, y, 10, 1.2); e.glow(x, y, 5, 'rgba(255,240,150,A)', 0.5); }
e.glow(272, 112, 60, 'rgba(180,200,255,A)', 0.12);
const c = document.createElement('canvas'); c.width = PW * SCALE; c.height = PH * SCALE;
e.render(c);
const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
// interface in the same pixel font
ctx.fillStyle = '#e8dcc4'; ctx.fillRect(60 * 3, 30 * 3, 240 * 3, 3); ctx.fillRect((60 + 0.38 * 240) * 3 - 6, 30 * 3 - 6, 15, 15);
['#a2ecf8', '#ffb4d0', '#aee6a0', '#beb2f4', '#ffdc7a'].forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect((144 + i * 16) * 3, 46 * 3, 12, 12); });
text(ctx, 'DRAG TO MOVE  KEEP THE BOAT LEVEL', 540, 1770, 6, '#e8dcc4', '#07081a', 'center');
window.SHOTS = { 'hd-ferry': c.toDataURL('image/png') };
document.body.dataset.ready = '1';
</script>
</body>
</html>
