<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Studio — four art styles</title>
<style>
  body { margin: 0; background: #14101f; color: #f3ecdf; font-family: Inter, 'DejaVu Sans', sans-serif; }
  .row { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .cell { display: flex; flex-direction: column; gap: 10px; }
  .cell h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .cell p { margin: 0; font-size: 14px; opacity: .75; width: 360px; line-height: 1.35; }
  canvas { width: 360px; height: 640px; border-radius: 10px; image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
'use strict';
// One scene (golden hour in a park: a corgi on the path, a duck on the pond), drawn four ways.
// Scene coordinates are 360 x 640; each renderer decides how shapes become pixels.

const MAT = {
  grass:  { ramp: ['#3d7450', '#5a9a58', '#86bf66', '#c3dd7c'] },
  path:   { ramp: ['#b98552', '#d6a873', '#ecc896', '#f8e2b8'] },
  water:  { ramp: ['#2f5f86', '#4886b0', '#7fc0d8', '#d8f3f6'] },
  rim:    { ramp: ['#2f5a46', '#3f6e52', '#4f8058', '#5f9060'] },
  lily:   { ramp: ['#2f6a44', '#3f8a50', '#68b25a', '#9fd27a'] },
  trunk:  { ramp: ['#4e3226', '#6e4632', '#8f5f40', '#b07a52'], outline: true },
  leaf:   { ramp: ['#2c5a44', '#3d7a50', '#5c9e58', '#93c86a'] },
  leafHi: { ramp: ['#3d7a50', '#5c9e58', '#86bf66', '#c3dd7c'] },
  hillFar:{ ramp: ['#8a78a8', '#9d88b4', '#b39cc0', '#c8b2cc'] },
  hillMid:{ ramp: ['#6f8c86', '#7f9e8c', '#93b294', '#a8c49c'] },
  treeFar:{ ramp: ['#56766c', '#62857a', '#729684', '#86a890'] },
  cloud:  { ramp: ['#e49c8a', '#f3bca2', '#ffdcc2', '#fff2e2'] },
  sun:    { ramp: ['#ffe3a8', '#fff0c8', '#fff7de', '#ffffff'] },
  corgi:  { ramp: ['#a9552a', '#d97c38', '#f0a45e', '#fbcf92'], outline: true },
  white:  { ramp: ['#d7c4b0', '#efe2d2', '#fff6ea', '#ffffff'], outline: true },
  dark:   { ramp: ['#1e1418', '#2e2026', '#46323a', '#6a5058'] },
  pink:   { ramp: ['#c8707e', '#e48a96', '#f4aab2', '#ffd0d4'] },
  duck:   { ramp: ['#cbbfae', '#e9e0d2', '#fbf6ee', '#ffffff'], outline: true },
  beak:   { ramp: ['#c8742a', '#ee9a3a', '#f8bf5c', '#ffe08a'], outline: true },
  wood:   { ramp: ['#6e3f2a', '#9a5a3a', '#bf7a4e', '#dc9c6a'], outline: true },
  red:    { ramp: ['#9a2a36', '#d2404c', '#ee6a70', '#ff9a9a'], outline: true },
  petalA: { ramp: ['#c84a6a', '#f2708a', '#ff9aae', '#ffd0da'] },
  petalB: { ramp: ['#c89a2a', '#f2c840', '#ffe070', '#fff2b0'] },
  petalC: { ramp: ['#7a5ab8', '#9a7ad8', '#bca0ee', '#e0d0ff'] },
  stem:   { ramp: ['#2f6a44', '#3f8a50', '#5aa05a', '#7fc06a'] },
};
const SKY = [[0, '#4d5fa8'], [0.42, '#c98aa0'], [0.7, '#f4a57c'], [1, '#ffd9a6']];
const GROUND = [[0, '#86b874'], [0.25, '#6aa65e'], [1, '#4c8a52']];

function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function bez(p0, p1, p2, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }

// ---------- the shared scene ----------
function drawScene(R) {
  R.gradient(0, 0, 360, 250, SKY);
  R.glow(252, 150, 90, '#fff1c8');
  R.ellipse(252, 150, 30, 30, MAT.sun, { flat: true });
  [[70, 70, 46], [150, 112, 30], [300, 60, 38]].forEach(([x, y, w]) => {
    R.ellipse(x, y, w, w * 0.32, MAT.cloud); R.ellipse(x - w * 0.35, y - 6, w * 0.45, w * 0.3, MAT.cloud); R.ellipse(x + w * 0.25, y - 9, w * 0.5, w * 0.36, MAT.cloud);
  });
  R.poly([[0, 250], [0, 205], [60, 184], [130, 200], [200, 176], [280, 196], [360, 180], [360, 250]], MAT.hillFar, { flat: true });
  R.poly([[0, 262], [0, 224], [90, 212], [170, 228], [260, 214], [360, 226], [360, 262]], MAT.hillMid, { flat: true });
  for (let i = 0; i < 9; i++) R.ellipse(10 + i * 22, 236 - (i % 3) * 3, 14, 13, MAT.treeFar);
  R.gradient(0, 250, 360, 390, GROUND);
  // path: a curve from the bottom of the screen into the distance
  const L = [], Rr = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, [x, y] = bez([205, 255], [130, 420], [215, 640], t), w = 6 + t * 46;
    L.push([x - w, y]); Rr.unshift([x + w, y]);
  }
  R.poly(L.concat(Rr), MAT.path, { soft: true });
  // pond with a mossy rim, lily pads and a duck
  R.ellipse(92, 336, 90, 38, MAT.rim, { flat: true });
  R.ellipse(92, 334, 84, 33, MAT.water, { water: true });
  R.ellipse(55, 345, 11, 4.5, MAT.lily); R.ellipse(150, 342, 9, 4, MAT.lily); R.ellipse(40, 326, 7, 3, MAT.lily);
  R.line(60, 322, 92, 322, 1.5, '#c8eef4'); R.line(100, 352, 140, 352, 1.5, '#c8eef4');
  R.shadow(116, 334, 18, 4);
  R.ellipse(110, 326, 19, 10, MAT.duck); R.ellipse(96, 320, 7, 5, MAT.duck);
  R.ellipse(125, 312, 8, 8, MAT.duck); R.ellipse(134, 315, 6, 2.8, MAT.beak); R.ellipse(127, 309, 1.6, 1.6, MAT.dark, { flat: true });
  // big tree
  R.shadow(300, 425, 62, 12);
  R.poly([[284, 425], [290, 330], [282, 300], [302, 318], [318, 296], [312, 332], [318, 425]], MAT.trunk);
  [[300, 250, 60, 46, 'leaf'], [254, 280, 40, 32, 'leaf'], [342, 286, 40, 34, 'leaf'], [292, 214, 46, 36, 'leafHi'], [320, 240, 36, 30, 'leafHi'], [262, 236, 32, 26, 'leafHi']]
    .forEach(([x, y, rx, ry, m]) => R.ellipse(x, y, rx, ry, MAT[m]));
  // bench
  R.shadow(100, 470, 40, 6);
  R.rect(70, 450, 6, 20, MAT.wood); R.rect(124, 450, 6, 20, MAT.wood);
  R.rect(64, 422, 72, 9, MAT.wood); R.rect(64, 434, 72, 9, MAT.wood); R.rect(60, 448, 80, 8, MAT.wood);
  // grass tufts
  const r = rnd(7);
  for (let i = 0; i < 70; i++) {
    const x = r() * 360, y = 270 + r() * 360;
    const onPath = Math.abs(x - bez([205, 255], [130, 420], [215, 640], (y - 255) / 385)[0]) < 12 + (y - 255) / 385 * 50;
    const inPond = ((x - 92) / 92) ** 2 + ((y - 336) / 40) ** 2 < 1;
    const onTree = x > 240 && y < 430 && y > 200;
    if (onPath || inPond || onTree) continue;
    R.tuft(x, y, 3 + (y - 270) / 60);
  }
  // the corgi (the hero)
  R.shadow(204, 536, 54, 9);
  R.rect(178, 508, 11, 22, MAT.corgi); R.rect(224, 508, 11, 22, MAT.corgi); // far legs
  R.ellipse(152, 488, 10, 8, MAT.corgi); // tail
  R.ellipse(196, 498, 46, 25, MAT.corgi);
  R.ellipse(200, 514, 30, 9, MAT.white);
  R.rect(164, 510, 12, 24, MAT.corgi); R.rect(212, 510, 12, 24, MAT.corgi); // near legs
  R.rect(164, 528, 12, 6, MAT.white); R.rect(212, 528, 12, 6, MAT.white);
  R.ellipse(232, 496, 15, 16, MAT.white); // chest
  R.poly([[224, 458], [231, 424], [246, 452]], MAT.corgi); R.poly([[242, 452], [256, 424], [260, 460]], MAT.corgi);
  R.poly([[229, 452], [232, 434], [240, 450]], MAT.pink, { flat: true }); R.poly([[248, 450], [255, 434], [256, 456]], MAT.pink, { flat: true });
  R.ellipse(242, 472, 23, 21, MAT.corgi);
  R.ellipse(258, 482, 14, 9, MAT.white);
  R.rect(226, 486, 14, 5, MAT.red);
  R.ellipse(270, 478, 4.5, 3.5, MAT.dark, { flat: true });
  R.ellipse(249, 467, 3.4, 4, MAT.dark, { flat: true }); R.ellipse(250, 465.6, 1.2, 1.2, MAT.sun, { flat: true });
  R.line(258, 488, 266, 487, 1.4, '#2e2026');
  // flowers in the foreground
  [[30, 600, 'petalA'], [56, 612, 'petalB'], [82, 598, 'petalC'], [300, 606, 'petalB'], [326, 594, 'petalA'], [344, 616, 'petalC'], [18, 624, 'petalC']]
    .forEach(([x, y, m]) => {
      R.line(x, y + 4, x + 2, y + 26, 2, MAT.stem.ramp[1]);
      for (let k = 0; k < 5; k++) { const a = k * 1.2566 - 1.57; R.ellipse(x + Math.cos(a) * 5, y + Math.sin(a) * 5, 4.2, 4.2, MAT[m]); }
      R.ellipse(x, y, 2.8, 2.8, MAT.petalB, { flat: true });
    });
  R.ui();
}

// ---------- helpers ----------
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function gradAt(stops, t) {
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
    return mix(hex(c0), hex(c1), (t - t0) / (t1 - t0));
  }
  return hex(stops[stops.length - 1][1]);
}
function inPoly(pts, x, y) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const GLYPH = { '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'], '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'], '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'], '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'], '8': ['111', '101', '111', '101', '111'], '9': ['111', '101', '111', '001', '111'] };

// ---------- A/B: pixel renderers (no anti-aliasing, hue-shifted ramps, selective outlines) ----------
function PixelRenderer(canvas, W, H, opts) {
  const s = W / 360, img = new Array(W * H).fill(null);
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) img[y * W + x] = c; };
  const get = (x, y) => (x >= 0 && y >= 0 && x < W && y < H ? img[y * W + x] : null);
  const shadeIdx = (lit) => (lit < 0.3 ? 0 : lit < 0.62 ? 1 : lit < 0.9 ? 2 : 3);
  function fillMask(mask, bx0, by0, bx1, by1, colorAt, mat) {
    for (let y = by0; y <= by1; y++) for (let x = bx0; x <= bx1; x++) if (mask(x, y)) set(x, y, colorAt(x, y));
    if (mat && mat.outline) { // selective outline: the shape's own darkest tone, not black
      const ol = mix(hex(mat.ramp[0]), [30, 20, 30], 0.45), cs = `rgb(${ol})`;
      for (let y = by0 - 1; y <= by1 + 1; y++) for (let x = bx0 - 1; x <= bx1 + 1; x++) {
        if (!mask(x, y)) continue;
        if (!mask(x - 1, y) || !mask(x + 1, y) || !mask(x, y - 1) || !mask(x, y + 1)) set(x, y, cs);
      }
    }
  }
  const R = {
    gradient(x, y, w, h, stops) {
      const steps = opts.bands;
      for (let py = Math.floor(y * s); py < Math.ceil((y + h) * s); py++) {
        const t = (py / s - y) / h, q = Math.min(1, Math.floor(t * steps) / (steps - 1));
        // clean bands, with a 2-pixel checker where two bands meet
        const tq = (t * steps) % 1 > 0.85 && ((py + 0) % 2 === 0) ? Math.min(1, q + 1 / (steps - 1)) : q;
        const c = `rgb(${gradAt(stops, tq)})`;
        for (let px = Math.floor(x * s); px < Math.ceil((x + w) * s); px++) {
          const alt = (t * steps) % 1 > 0.85 && (px + py) % 2 === 0;
          set(px, py, alt ? `rgb(${gradAt(stops, Math.min(1, q + 1 / (steps - 1)))})` : `rgb(${gradAt(stops, q)})`);
        }
      }
    },
    glow(cx, cy, r, col) {
      const c = hex(col);
      for (let py = Math.floor((cy - r) * s); py < (cy + r) * s; py++) for (let px = Math.floor((cx - r) * s); px < (cx + r) * s; px++) {
        const d = Math.hypot(px / s - cx, py / s - cy) / r;
        if (d >= 1) continue;
        const band = d < 0.55 ? 0.45 : d < 0.8 ? 0.25 : 0.12;
        const cur = get(px, py); if (!cur) continue;
        const m = cur.match(/\d+/g).map(Number);
        set(px, py, `rgb(${mix(m, c, band)})`);
      }
    },
    ellipse(cx, cy, rx, ry, mat, o = {}) {
      const X = cx * s, Y = cy * s, RX = Math.max(0.8, rx * s), RY = Math.max(0.8, ry * s);
      const mask = (x, y) => { const dx = (x + 0.5 - X) / RX, dy = (y + 0.5 - Y) / RY; return dx * dx + dy * dy <= 1; };
      fillMask(mask, Math.floor(X - RX) - 1, Math.floor(Y - RY) - 1, Math.ceil(X + RX) + 1, Math.ceil(Y + RY) + 1, (x, y) => {
        if (o.flat) return mat.ramp[1];
        const dx = (x + 0.5 - X) / RX, dy = (y + 0.5 - Y) / RY;
        let lit = 0.5 - dx * 0.32 - dy * 0.42;
        if (o.water) { lit = 0.55 - dy * 0.35 + (((y * 3 + x) % 23 === 0) ? 0.5 : 0); }
        const hi = Math.hypot(dx + 0.38, dy + 0.45) < 0.28 ? 3 : -1;

    },
    poly(pts, mat, o = {}) {
      const P = pts.map(([x, y]) => [x * s, y * s]);
      const xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
      const y0 = Math.min(...ys), y1 = Math.max(...ys);
      const mask = (x, y) => inPoly(P, x + 0.5, y + 0.5);
      fillMask(mask, Math.floor(Math.min(...xs)), Math.floor(y0), Math.ceil(Math.max(...xs)), Math.ceil(y1), (x, y) => {
        if (o.flat) return mat.ramp[1];
        const edge = !mask(x - 2, y) || !mask(x + 2, y);
        if (o.soft) return edge ? mat.ramp[0] : ((x * 7 + y * 13) % 41 === 0 ? mat.ramp[3] : mat.ramp[(x + y) % 9 === 0 ? 2 : 1]);
        const t = (y - y0) / Math.max(1, y1 - y0);
        return mat.ramp[t < 0.12 ? 2 : t > 0.8 ? 0 : 1];
      }, o.flat ? null : mat);
    },
    rect(x, y, w, h, mat) {
      const X0 = Math.round(x * s), Y0 = Math.round(y * s), X1 = Math.round((x + w) * s) - 1, Y1 = Math.round((y + h) * s) - 1;
      const mask = (px, py) => px >= X0 && px <= X1 && py >= Y0 && py <= Y1;
      fillMask(mask, X0, Y0, X1, Y1, (px, py) => mat.ramp[py === Y0 ? 2 : py >= Y1 - Math.max(0, Math.round(s)) ? 0 : 1], mat);
    },
    shadow(cx, cy, rx, ry) {
      const X = cx * s, Y = cy * s, RX = rx * s, RY = ry * s;
      for (let y = Math.floor(Y - RY); y <= Y + RY; y++) for (let x = Math.floor(X - RX); x <= X + RX; x++) {
        const dx = (x + 0.5 - X) / RX, dy = (y + 0.5 - Y) / RY;
        if (dx * dx + dy * dy > 1) continue;
        const cur = get(x, y); if (!cur) continue;
        const m = cur.match(/\d+/g).map(Number);
        set(x, y, `rgb(${mix(m, [52, 40, 80], 0.38)})`); // shadows shift towards purple, not black
      }
    },
    line(x1, y1, x2, y2, w, col) {
      const n = Math.ceil(Math.hypot(x2 - x1, y2 - y1) * s);
      for (let i = 0; i <= n; i++) {
        const x = Math.round((x1 + (x2 - x1) * i / n) * s), y = Math.round((y1 + (y2 - y1) * i / n) * s);

      }
    },
    tuft(x, y, h) {
      const X = Math.round(x * s), Y = Math.round(y * s), H2 = Math.max(2, Math.round(h * s));
      for (let i = 0; i < H2; i++) { set(X - Math.floor(i / 2), Y - i, MAT.grass.ramp[2]); set(X + Math.floor(i / 2) + 1, Y - i, MAT.grass.ramp[3]); }
      set(X, Y + 1, MAT.grass.ramp[0]);
    },
    ui() {
      // score pill and three hearts, drawn as pixels
      const k = opts.ui;
      const pill = (x, y, w, h) => {
        for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
          const corner = (px < 1 || px > w - 2) && (py < 1 || py > h - 2);

          const edge = px === 0 || py === 0 || px === w - 1 || py === h - 1;
          set(x + px, y + py, edge ? '#2a1e2e' : py < h / 2 ? '#fff6e4' : '#f0e2c8');

      [[0, 2, 2, 2], [3, 0, 2, 2], [6, 2, 2, 2], [2, 4, 5, 3]].forEach(([x, y, w, h]) => { for (let a = 0; a < w * k; a++) for (let b = 0; b < h * k; b++) set(8 * k + x * k + a, 7 * k + y * k + b, '#d97c38'); });
      let cx = 20 * k;
      '12'.split('').forEach((ch) => { GLYPH[ch].forEach((row, yy) => [...row].forEach((v, xx) => { if (v === '1') for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) set(cx + xx * k + a, 8 * k + yy * k + b, '#2a1e2e'); })); cx += 4 * k; });
      const heart = ['01010', '11111', '11111', '01110', '00100'];
      for (let h = 0; h < 3; h++) heart.forEach((row, yy) => [...row].forEach((v, xx) => {
        if (v === '1') for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) set((140 + h * 8) * k + xx * k + a, 7 * k + yy * k + b, h < 2 ? '#ee4a5a' : '#6a5058');
      }));
    },
    finish() {
      const off = document.createElement('canvas'); off.width = W; off.height = H;
      const o = off.getContext('2d');
      img.forEach((c, i) => { if (c) { o.fillStyle = c; o.fillRect(i % W, Math.floor(i / W), 1, 1); } });
      const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, 360, 640);
    },
  };
  return R;
}

// ---------- C: soft vector (smooth shapes, gradients, no outlines) ----------
function VectorRenderer(canvas, cartoon) {
  const ctx = canvas.getContext('2d');
  const OL = '#2b1d2c', LW = 3.2;
  const pathE = (cx, cy, rx, ry) => { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); };
  const pathP = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); };
  const outlineOn = (mat, o) => cartoon && !o.flat && mat !== MAT.sun && mat !== MAT.cloud && mat !== MAT.hillFar && mat !== MAT.hillMid && mat !== MAT.treeFar && mat !== MAT.water && mat !== MAT.rim;
  function shade(build, bbox, mat, o) {
    const [x0, y0, x1, y1] = bbox, w = x1 - x0, h = y1 - y0;
    if (cartoon) {
      build(); ctx.fillStyle = o.flat ? mat.ramp[1] : mat.ramp[0]; ctx.fill();
      if (!o.flat) {
        ctx.save(); build(); ctx.clip();
        ctx.translate(-w * 0.1, -h * 0.16); build(); ctx.fillStyle = mat.ramp[1]; ctx.fill();
        ctx.restore();
        ctx.save(); build(); ctx.clip();
        pathE(x0 + w * 0.32, y0 + h * 0.28, w * 0.16, h * 0.1); ctx.fillStyle = mat.ramp[3]; ctx.globalAlpha = 0.85; ctx.fill();
        ctx.restore();
      }
      if (outlineOn(mat, o)) { build(); ctx.lineWidth = LW; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
      return;
    }
    build();
    if (o.flat) ctx.fillStyle = mat.ramp[1];
    else {
      const g = ctx.createRadialGradient(x0 + w * 0.35, y0 + h * 0.3, Math.min(w, h) * 0.05, x0 + w * 0.5, y0 + h * 0.5, Math.max(w, h) * 0.65);
      g.addColorStop(0, mat.ramp[3]); g.addColorStop(0.35, mat.ramp[2]); g.addColorStop(0.75, mat.ramp[1]); g.addColorStop(1, mat.ramp[0]);
      ctx.fillStyle = g;
    }
    ctx.fill();
  }
  return {
    gradient(x, y, w, h, stops) {
      const g = ctx.createLinearGradient(0, y, 0, y + h); stops.forEach(([t, c]) => g.addColorStop(t, c));
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    },
    glow(cx, cy, r, col) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, col + 'cc'); g.addColorStop(1, col + '00');
      ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    },
    ellipse(cx, cy, rx, ry, mat, o = {}) {
      if (o.water) {
        pathE(cx, cy, rx, ry);
        const g = ctx.createLinearGradient(0, cy - ry, 0, cy + ry); g.addColorStop(0, mat.ramp[2]); g.addColorStop(0.5, mat.ramp[1]); g.addColorStop(1, mat.ramp[0]);
        ctx.fillStyle = g; ctx.fill();
        if (cartoon) { ctx.lineWidth = LW; ctx.strokeStyle = OL; ctx.stroke(); }
        return;
      }
      shade(() => pathE(cx, cy, rx, ry), [cx - rx, cy - ry, cx + rx, cy + ry], mat, o);
    },
    poly(pts, mat, o = {}) {
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      if (o.soft) {
        pathP(pts);
        const g = ctx.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys)); g.addColorStop(0, mat.ramp[2]); g.addColorStop(1, mat.ramp[1]);
        ctx.fillStyle = cartoon ? mat.ramp[2] : g; ctx.fill();
        if (cartoon) { ctx.lineWidth = LW; ctx.strokeStyle = OL; ctx.stroke(); }
        return;
      }
      if (o.flat && !cartoon) {
        pathP(pts);
        const g = ctx.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys)); g.addColorStop(0, mat.ramp[2]); g.addColorStop(1, mat.ramp[0]);
        ctx.fillStyle = mat === MAT.pink ? mat.ramp[1] : g; ctx.fill(); return;
      }
      shade(() => pathP(pts), [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], mat, o);
    },
    rect(x, y, w, h, mat) {
      const r = Math.min(w, h) * 0.35;
      shade(() => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }, [x, y, x + w, y + h], mat, {});
    },
    shadow(cx, cy, rx, ry) {
      pathE(cx, cy, rx, ry);
      if (cartoon) { ctx.fillStyle = 'rgba(40,30,70,0.28)'; ctx.fill(); return; }
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      g.addColorStop(0, 'rgba(40,30,80,0.38)'); g.addColorStop(1, 'rgba(40,30,80,0)');
      ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); ctx.translate(-cx, -cy);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    },
    line(x1, y1, x2, y2, w, col) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = cartoon ? w + 0.8 : w; ctx.lineCap = 'round'; ctx.strokeStyle = cartoon && w > 1.8 ? OL : col; ctx.stroke(); },
    tuft(x, y, h) {
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - h * 0.5, y - h); ctx.quadraticCurveTo(x, y, x, y); ctx.moveTo(x + h * 0.6, y - h * 1.1); ctx.quadraticCurveTo(x + 1, y, x + 1, y);
      ctx.lineWidth = cartoon ? 2.2 : 1.6; ctx.strokeStyle = cartoon ? MAT.grass.ramp[0] : MAT.grass.ramp[2]; ctx.stroke();
    },
    ui() {
      if (cartoon) {
        ctx.beginPath(); ctx.roundRect(12, 14, 96, 38, 19); ctx.fillStyle = '#fff6e4'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = OL; ctx.stroke();
        ctx.font = '22px "Archivo Black"'; ctx.fillStyle = OL; ctx.fillText('12', 58, 42);
        ctx.font = '20px "Archivo Black"'; ctx.fillStyle = '#d97c38'; ctx.fillText('🐾', 22, 41);
        for (let h = 0; h < 3; h++) { ctx.font = '26px sans-serif'; ctx.fillStyle = h < 2 ? '#ee4a5a' : '#6a5058'; ctx.fillText('♥', 262 + h * 30, 44); }
      } else {
        ctx.beginPath(); ctx.roundRect(14, 16, 88, 34, 17); ctx.fillStyle = 'rgba(255,248,236,0.75)'; ctx.fill();
        ctx.font = '600 19px Inter'; ctx.fillStyle = '#3a2a3a'; ctx.fillText('12', 60, 40);
        ctx.beginPath(); ctx.arc(38, 33, 8, 0, Math.PI * 2); ctx.fillStyle = '#d97c38'; ctx.fill();
        for (let h = 0; h < 3; h++) { ctx.beginPath(); ctx.arc(282 + h * 24, 33, 7, 0, Math.PI * 2); ctx.fillStyle = h < 2 ? 'rgba(238,74,90,0.95)' : 'rgba(255,255,255,0.45)'; ctx.fill(); }
      }
    },
    finish() {},
  };
}

const STYLES = [
  { name: 'A — Clean pixel art', note: 'Same 180 × 320 grid as now, but a curated warm palette with hue-shifted shading, soft coloured outlines instead of black, clean colour bands instead of noisy dither, and much bigger characters. Think Stardew Valley / Eastward on a phone.',
    make: (c) => PixelRenderer(c, 180, 320, { bands: 9, ui: 1 }) },
  { name: 'B — Detailed HD pixel art', note: 'Double resolution (360 × 640, scaled 3×). Finer detail, smoother curves and room for expressive faces, still clearly pixel art. More work per sprite and less "retro".',
    make: (c) => PixelRenderer(c, 360, 640, { bands: 14, ui: 2 }) },
  { name: 'C — Soft vector', note: 'No pixels: smooth shapes, gradients and soft shadows, calm and premium. Think Alto\'s Adventure / Monument Valley. Looks expensive in clips but is less "chunky" and toy-like.',
    make: (c) => VectorRenderer(c, false) },
  { name: 'D — Bold cartoon', note: 'Thick dark outlines, flat colours with one cel shade and a highlight, chunky friendly UI. Very readable on small screens. Think Cult of the Lamb / sticker style.',
    make: (c) => VectorRenderer(c, true) },
];
const row = document.getElementById('row');
STYLES.forEach((st) => {
  const cell = document.createElement('div'); cell.className = 'cell';
  const h = document.createElement('h2'); h.textContent = st.name;
  const c = document.createElement('canvas'); c.width = 360; c.height = 640;
  const p = document.createElement('p'); p.textContent = st.note;
  cell.append(h, c, p); row.append(cell);
  const R = st.make(c);
  drawScene(R);
  R.finish();
});
document.body.dataset.ready = '1';
</script>
