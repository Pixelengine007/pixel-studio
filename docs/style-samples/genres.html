<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One style, every genre</title>
<style>body { margin: 0; background: #111; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 300, H = 533;
const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function gradTex(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); stops.forEach(([t, col]) => g.addColorStop(t, col)); x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const ramp = (() => { const d = new Uint8Array([70, 150, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const ramp4 = (() => { const d = new Uint8Array([55, 120, 190, 255]); const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

// ---------- four looks, same models ----------
const LOOKS = {
  toon:    { seg: 16, outline: 0.05, tone: THREE.NoToneMapping, exposure: 1, mat: (c, o) => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, emissive: o.em || 0, emissiveIntensity: o.ei || 1 }) },
  clay:    { seg: 28, outline: 0, tone: THREE.ACESFilmicToneMapping, exposure: 1.1, tint: 0.12, mat: (c, o) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.72, metalness: 0, emissive: o.em || 0, emissiveIntensity: o.ei || 1 }) },
  lowpoly: { seg: 6, outline: 0, tone: THREE.ACESFilmicToneMapping, exposure: 1.05, mat: (c, o) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true, emissive: o.em || 0, emissiveIntensity: o.ei || 1 }) },
  pixel:   { seg: 10, outline: 0.07, tone: THREE.NoToneMapping, exposure: 1, pixel: 4, mat: (c, o) => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp4, emissive: o.em || 0, emissiveIntensity: o.ei || 1 }) },
};
function kit(lookName) {
  const L = LOOKS[lookName];
  const olMat = new THREE.MeshBasicMaterial({ color: '#160e18', side: THREE.BackSide, fog: true });
  const tintC = (c) => { const col = new THREE.Color(c); if (L.tint) col.lerp(new THREE.Color('#ffffff'), L.tint); return col; };
  const mesh = (geo, c, o = {}) => {
    const m = new THREE.Mesh(geo, L.mat(tintC(c), o)); m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
    if (L.outline && !o.noOl) { const ol = new THREE.Mesh(geo, olMat); ol.scale.setScalar(1 + (o.ol ?? L.outline)); m.add(ol); }
    return m;
  };
  const s = L.seg;
  const K = {
    L, mesh,
    sph: (r, c, o) => mesh(new THREE.SphereGeometry(r, Math.max(6, s), Math.max(4, Math.round(s * 0.7))), c, o),
    cap: (r, l, c, o) => mesh(new THREE.CapsuleGeometry(r, l, Math.max(2, s / 4 | 0), Math.max(6, s)), c, o),
    cyl: (r1, r2, h, c, o) => mesh(new THREE.CylinderGeometry(r1, r2, h, Math.max(6, s)), c, o),
    cone: (r, h, c, o) => mesh(new THREE.ConeGeometry(r, h, Math.max(5, s)), c, o),
    box: (w, h, d, c, o = {}) => mesh(lookName === 'lowpoly' ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h, d) * (o.r ?? 0.18)), c, o),
    at(m, x, y, z, rx = 0, ry = 0, rz = 0, sc = 1) { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); if (sc !== 1) (typeof sc === 'number' ? m.scale.setScalar(sc) : m.scale.set(...sc)); return m; },
    limb(a, b, r, c, o) { // a capsule between two points
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), len = d.length();
      const m = K.cap(r, Math.max(0.01, len - r * 0.4), c, o); m.position.copy(A).add(B).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); return m;
    },
    group(...xs) { const g = new THREE.Group(); xs.forEach((x) => g.add(x)); return g; },
  };
  return K;
}

// The studio's character: a bipedal fox (or wolf), posed per genre. Faces +x.
function critter(K, kind, pose) {
  const C = kind === 'wolf' ? { body: '#8a93a8', light: '#e4e8f0', dark: '#2a2433', ear: '#8a93a8', glove: '#3a7bd5' } : { body: '#f27a2e', light: '#fff4e6', dark: '#2a1d26', ear: '#f27a2e', glove: '#e8434e' };
  const g = new THREE.Group();
  const add = (m) => (g.add(m), m);
  const sit = pose === 'sit' || pose === 'drive';
  if (!sit) {
    const spread = pose === 'fight' ? 0.32 : 0.12;
    add(K.limb([-spread * 0.6, 0.95, 0.2], [-spread, 0.2, 0.22], 0.15, C.body)); add(K.limb([spread * 0.6, 0.95, -0.2], [spread, 0.2, -0.22], 0.15, C.body));
    add(K.at(K.sph(0.18, C.dark), -spread + 0.06, 0.12, 0.22, 0, 0, 0, [1.4, 0.7, 1])); add(K.at(K.sph(0.18, C.dark), spread + 0.06, 0.12, -0.22, 0, 0, 0, [1.4, 0.7, 1]));
  } else {
    add(K.limb([0, 0.95, 0.2], [0.7, 0.85, 0.24], 0.15, C.body)); add(K.limb([0, 0.95, -0.2], [0.7, 0.85, -0.24], 0.15, C.body));
    if (pose === 'sit') { add(K.limb([0.7, 0.85, 0.24], [0.75, 0.25, 0.26], 0.13, C.body)); add(K.limb([0.7, 0.85, -0.24], [0.8, 0.25, -0.26], 0.13, C.body)); }
  }
  const lean = pose === 'fight' ? 0.18 : 0;
  add(K.at(K.cap(0.4, 0.45, C.body), lean * 0.5, 1.32, 0, 0, 0, -lean));
  add(K.at(K.sph(0.3, C.light), 0.24 + lean * 0.5, 1.26, 0, 0, 0, 0, [0.55, 1.05, 0.95]));
  const hx = lean * 1.2;
  add(K.at(K.sph(0.44, C.body), hx, 2.08, 0));
  add(K.at(K.sph(0.24, C.light), hx + 0.4, 1.97, 0, 0, 0, 0, [1.35, 0.78, 0.9]));
  add(K.at(K.sph(0.07, C.dark, { noOl: true }), hx + 0.72, 2.0, 0));
  [0.17, -0.17].forEach((z) => add(K.at(K.sph(0.065, C.dark, { noOl: true }), hx + 0.33, 2.18, z, 0, 0, 0, [1, 1.3, 1])));
  if (kind === 'wolf') [0.2, -0.2].forEach((z) => add(K.at(K.cone(0.15, 0.42, C.ear), hx - 0.08, 2.55, z, z * 0.8, 0, 0.1)));
  else [0.22, -0.22].forEach((z) => add(K.at(K.cone(0.17, 0.5, C.ear), hx - 0.06, 2.58, z, z * 0.8, 0, 0.12)));
  // tail
  add(K.limb([-0.35, 1.0, 0], [-0.95, 1.45, 0], 0.22, C.body)); add(K.at(K.sph(0.2, C.light), -1.05, 1.55, 0));
  // arms by pose
  const sh = [[hx * 0.6 + 0.05, 1.62, 0.42], [hx * 0.6 + 0.05, 1.62, -0.42]];
  const arm = (from, to, glove) => { add(K.limb(from, to, 0.11, C.body)); if (glove) add(K.at(K.sph(0.2, glove), to[0], to[1], to[2])); else add(K.at(K.sph(0.13, C.dark), to[0], to[1], to[2])); };
  if (pose === 'fight') { arm(sh[0], [1.25, 1.75, 0.25], C.glove); arm(sh[1], [0.6, 1.95, -0.3], C.glove); }
  else if (pose === 'drive') { arm(sh[0], [0.85, 1.35, 0.3]); arm(sh[1], [0.85, 1.35, -0.3]); }
  else if (pose === 'flash') { arm(sh[0], [0.85, 1.55, 0.35]); arm(sh[1], [0.25, 1.1, -0.5]); }
  else if (pose === 'sit') { arm(sh[0], [0.75, 1.35, 0.25]); arm(sh[1], [0.75, 1.35, -0.2]); }
  else { arm(sh[0], [0.2, 0.95, 0.5]); arm(sh[1], [0.2, 0.95, -0.5]); }
  return g;
}

function sunLight(scene, color, intensity, pos, size = 14) {
  const d = new THREE.DirectionalLight(color, intensity); d.position.set(...pos); d.castShadow = true;
  d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -size, right: size, top: size, bottom: -size, far: 80 }); d.shadow.bias = -0.0006; d.shadow.radius = 4;
  scene.add(d); return d;
}

// ---------- FIGHTING: two fighters on a cliff-top ring at sunset ----------
function fighting(K) {
  const scene = new THREE.Scene(); scene.background = gradTex([[0, '#2b1e5a'], [0.45, '#b4487a'], [0.75, '#ff8a4a'], [1, '#ffd08a']]);
  scene.fog = new THREE.Fog('#ff9a6a', 22, 60);
  scene.add(new THREE.HemisphereLight('#ffd6b0', '#4a2a5a', 1.1)); sunLight(scene, '#ffc89a', 2.6, [8, 10, 6]);
  const rim = new THREE.DirectionalLight('#7a8aff', 1.2); rim.position.set(-6, 5, -8); scene.add(rim);
  [[-14, -4, -26, 10], [6, -6, -32, 14], [18, -3, -24, 8]].forEach(([x, y, z, r]) => scene.add(K.at(K.cone(r, r * 2.2, '#6a3a6a', { noOl: true, cast: false }), x, y, z)));
  scene.add(K.at(K.cyl(5.2, 5.6, 1.2, '#b8a8a0'), 0, -0.6, 0)); scene.add(K.at(K.cyl(4.4, 4.4, 0.06, '#d8cabe', { noOl: true }), 0, 0.02, 0));
  for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; if (Math.sin(a) > -0.2) continue; const p = K.group(K.at(K.cyl(0.12, 0.12, 1.6, '#4a2a2a'), 0, 0.8, 0), K.at(K.box(0.45, 0.55, 0.45, '#ffcf6a', { em: '#ff9a3a', ei: 0.9 }), 0, 1.8, 0)); K.at(p, Math.cos(a) * 4.9, 0, Math.sin(a) * 4.9); scene.add(p); }
  const fox = critter(K, 'fox', 'fight'); K.at(fox, -1.25, 0, 0.3); scene.add(fox);
  const wolf = critter(K, 'wolf', 'fight'); K.at(wolf, 1.35, 0, 0.1, 0, Math.PI, 0); scene.add(wolf);
  // impact burst where the punches meet
  const star = new THREE.Shape(); for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, r = i % 2 ? 0.28 : 0.7; i ? star.lineTo(Math.cos(a) * r, Math.sin(a) * r) : star.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const burst = new THREE.Mesh(new THREE.ShapeGeometry(star), new THREE.MeshBasicMaterial({ color: '#fff3a0' })); burst.position.set(0.05, 1.8, 0.7); scene.add(burst);
  const burst2 = new THREE.Mesh(new THREE.ShapeGeometry(star), new THREE.MeshBasicMaterial({ color: '#ff8a3a' })); burst2.scale.setScalar(1.35); burst2.position.set(0.05, 1.8, 0.65); scene.add(burst2);
  const r = rng(5); for (let i = 0; i < 24; i++) { const p = K.at(K.sph(0.07, '#ffb0c8', { noOl: true, cast: false }), (r() - 0.5) * 12, r() * 7, (r() - 0.5) * 6, 0, 0, 0, [1.4, 0.5, 1]); scene.add(p); }
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200); cam.position.set(0, 3.4, 15.5); cam.lookAt(0, 1.6, 0);
  return { scene, cam, ui: 'fight' };
}

// ---------- HORROR: a fox with a flashlight in a foggy dead forest ----------
function horror(K) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b1214');
  scene.fog = new THREE.FogExp2('#10201e', 0.055);
  scene.add(new THREE.HemisphereLight('#4a7080', '#080c0c', 0.6));
  const moon = new THREE.DirectionalLight('#8ab4d0', 1.1); moon.position.set(-4, 8, -10); scene.add(moon);
  const ground = K.mesh(new THREE.PlaneGeometry(60, 60), '#2a3530', { noOl: true }); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const r = rng(13);
  const deadTree = (x, z, h) => {
    const t = K.group(K.at(K.cyl(0.18, 0.32, h, '#2a2326'), 0, h / 2, 0));
    for (let i = 0; i < 4; i++) { const y = h * (0.45 + r() * 0.45), a = r() * 6.28, l = 0.8 + r() * 1.4; t.add(K.limb([0, y, 0], [Math.cos(a) * l, y + l * 0.6, Math.sin(a) * l], 0.07, '#2a2326')); }
    K.at(t, x, 0, z, 0, r() * 6, (r() - 0.5) * 0.15); scene.add(t);
  };
  [[-3.5, -2, 6], [3.8, -4, 7], [-6, -8, 8], [1.5, -10, 7], [6, -12, 8], [-2.5, -15, 9], [-7.5, -3, 5.5], [7.5, -6, 6]].forEach(([x, z, h]) => deadTree(x, z, h));
  [[-1.8, 0.5], [2.4, -1.2], [0.5, -3.5]].forEach(([x, z]) => scene.add(K.at(K.box(0.7, 1.0, 0.25, '#5a6260', { r: 0.4 }), x, 0.45, z, -0.15, r(), (r() - 0.5) * 0.3)));
  const cabin = K.group(K.at(K.box(3.4, 2.4, 2.6, '#3a3230'), 0, 1.2, 0), K.at(K.mesh(new THREE.ConeGeometry(2.7, 1.6, 4), '#2a2224'), 0, 3.2, 0, 0, Math.PI / 4, 0), K.at(K.box(0.6, 0.5, 0.1, '#ff3a2a', { em: '#ff2a1a', ei: 1.6, noOl: true }), 0.8, 1.4, 1.32));
  K.at(cabin, 1.6, 0, -9, 0, -0.3, 0); scene.add(cabin);
  // something watching from the trees
  [[-4.6, 1.9, -6.5], [5.2, 2.4, -9], [-1.2, 1.6, -12.5]].forEach(([x, y, z]) => [-0.14, 0.14].forEach((dx) => scene.add(K.at(new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: '#d8ff6a', fog: false })), x + dx, y, z))));
  const fox = critter(K, 'fox', 'flash'); K.at(fox, 0.2, 0, 3.2, 0, Math.PI / 2 + 0.35, 0); scene.add(fox);
  const torch = K.at(K.cyl(0.08, 0.1, 0.4, '#3a3a40'), 0, 0, 0, 0, 0, Math.PI / 2); fox.add(K.at(torch, 1.05, 1.55, 0.35, 0, 0, Math.PI / 2));
  const spot = new THREE.SpotLight('#fff2c8', 900, 26, 0.36, 0.5, 1.6); spot.position.set(0.55, 1.6, 2.25); spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024);
  spot.target.position.set(-1.6, 0.4, -6.5); scene.add(spot); scene.add(spot.target);
  // visible beam: a soft additive cone along the torch's direction
  const beamGeo = new THREE.ConeGeometry(2.6, 9.5, 32, 1, true); beamGeo.translate(0, -4.75, 0);
  const beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: '#fff4d0', transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  beam.position.copy(spot.position); beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), spot.target.position.clone().sub(spot.position).normalize()); scene.add(beam);
  const glowL = new THREE.PointLight('#ffe8b0', 4, 3, 1.5); glowL.position.set(0.9, 1.6, 2.6); scene.add(glowL);
  const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100); cam.position.set(2.2, 3.0, 9.6); cam.lookAt(-0.4, 1.3, -2.2);
  return { scene, cam, ui: 'horror' };
}

// ---------- RACING: karts on a winding road ----------
function racing(K) {
  const scene = new THREE.Scene(); scene.background = gradTex([[0, '#3aa2ff'], [0.6, '#9fdcff'], [1, '#e8f8ff']]);
  scene.fog = new THREE.Fog('#cfefff', 40, 110);
  scene.add(new THREE.HemisphereLight('#ffffff', '#6a9a5a', 1.2)); sunLight(scene, '#fff2dc', 2.5, [-10, 16, 8], 18);
  const ground = K.mesh(new THREE.PlaneGeometry(200, 200), '#6cc35a', { noOl: true }); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  // road ribbon along a curve
  const curve = new THREE.CatmullRomCurve3([[0, 0, 12], [0, 0, 2], [1.5, 0, -10], [7, 0, -22], [5, 0, -36], [-6, 0, -48], [-10, 0, -64]].map((p) => new THREE.Vector3(...p)));
  const ribbon = (width, y, color, dash) => {
    const pts = curve.getSpacedPoints(160), pos = [], idx = [];
    pts.forEach((p, i) => { const t = curve.getTangentAt(i / 160), n = new THREE.Vector3(-t.z, 0, t.x).normalize().multiplyScalar(width / 2); pos.push(p.x + n.x, y, p.z + n.z, p.x - n.x, y, p.z - n.z); if (i < 160 && (!dash || i % 4 < 2)) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } });
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    const m = K.mesh(geo, color, { noOl: true, cast: false }); m.material.side = THREE.DoubleSide; scene.add(m);
  };
  ribbon(7.4, 0.02, '#f2f2f2'); ribbon(6.6, 0.03, '#5a5a6a'); ribbon(0.25, 0.04, '#ffffff', true);
  // red-white kerbs
  const kpts = curve.getSpacedPoints(80);
  kpts.forEach((p, i) => { if (i % 2) return; const t = curve.getTangentAt(i / 80), n = new THREE.Vector3(-t.z, 0, t.x).normalize(); [1, -1].forEach((sgn) => { const k = K.box(0.5, 0.12, 0.9, (i / 2) % 2 ? '#e8434e' : '#ffffff', { noOl: true, cast: false }); k.position.set(p.x + n.x * 3.7 * sgn, 0.05, p.z + n.z * 3.7 * sgn); k.rotation.y = Math.atan2(t.x, t.z); scene.add(k); }); });
  const r = rng(21);
  for (let i = 0; i < 46; i++) { const p = curve.getPointAt(r()); const side = r() < 0.5 ? 1 : -1, off = 6 + r() * 10; const tr = K.group(K.at(K.cyl(0.15, 0.22, 1.2, '#8a5530'), 0, 0.6, 0), K.at(K.cone(1.1, 2.4, r() < 0.5 ? '#2f9a4a' : '#45b55a'), 0, 2.2, 0)); K.at(tr, p.x + side * off, 0, p.z); scene.add(tr); }
  // checkpoint arch
  const arch = K.group(K.at(K.box(0.4, 4.2, 0.4, '#2a2a3a'), -4.3, 2.1, 0), K.at(K.box(0.4, 4.2, 0.4, '#2a2a3a'), 4.3, 2.1, 0), K.at(K.box(9.2, 0.9, 0.3, '#ffcc00'), 0, 4.2, 0));
  K.at(arch, 1.2, 0, -9); scene.add(arch);
  const kart = (body, kind, x, z, ry) => {
    const g = K.group(K.at(K.box(1.4, 0.45, 2.2, body), 0, 0.45, 0), K.at(K.box(1.0, 0.3, 0.8, body), 0, 0.5, 1.2), K.at(K.box(1.6, 0.12, 0.35, '#2a2a3a'), 0, 1.0, -1.1));
    [[0.78, 0.75], [-0.78, 0.75], [0.8, -0.8], [-0.8, -0.8]].forEach(([wx, wz]) => g.add(K.at(K.cyl(0.32, 0.32, 0.3, '#22222a'), wx, 0.32, wz, 0, 0, Math.PI / 2)));
    const d = critter(K, kind, 'drive'); K.at(d, -0.1, -0.1, -0.1, 0, -Math.PI / 2, 0, 0.62); g.add(d);
    K.at(g, x, 0, z, 0, ry, 0); scene.add(g); return g;
  };
  kart('#e8434e', 'fox', 0.4, 4.2, 0.05);
  kart('#3a7bd5', 'wolf', 2.6, -5.5, -0.15);
  const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 200); cam.position.set(0.2, 4.0, 11.5); cam.lookAt(0.8, 1.0, -4);
  return { scene, cam, ui: 'race' };
}

// ---------- CHILL: fishing off a dock at golden hour ----------
function chill(K) {
  const scene = new THREE.Scene(); scene.background = gradTex([[0, '#6a7ad8'], [0.45, '#f2a2b8'], [0.8, '#ffd2a0'], [1, '#fff0d0']]);
  scene.fog = new THREE.Fog('#ffd2b0', 25, 70);
  scene.add(new THREE.HemisphereLight('#ffe2c8', '#5a6a8a', 1.05)); sunLight(scene, '#ffd0a0', 2.0, [-10, 7, -10]);
  const water = K.mesh(new THREE.PlaneGeometry(120, 120, 40, 40), '#7ac0d8', { noOl: true, cast: false }); water.rotation.x = -Math.PI / 2; water.position.y = -0.4; scene.add(water);
  [[-16, -2, -36, 12, '#8a7ab0'], [6, -3, -42, 16, '#9a88b8'], [22, -2, -34, 10, '#8a7ab0']].forEach(([x, y, z, r2, c]) => scene.add(K.at(K.sph(r2, c, { noOl: true, cast: false }), x, y, z, 0, 0, 0, [1.4, 0.7, 1])));
  for (let i = 0; i < 6; i++) scene.add(K.at(K.box(1.0, 0.18, 3.0, '#b07a4e', { r: 0.1 }), -1.8 + i * 1.05, 0, 3.8));
  [[-2.2, 2.4], [3.4, 2.4], [-2.2, 5.2], [3.4, 5.2]].forEach(([x, z]) => scene.add(K.at(K.cyl(0.14, 0.14, 1.4, '#7a4e34'), x, -0.5, z)));
  const fox = critter(K, 'fox', 'sit'); K.at(fox, 0.8, 0.08, 2.75, 0, Math.PI / 2, 0, 0.9); scene.add(fox);
  scene.add(K.limb([1.05, 1.15, 2.1], [2.2, 3.2, -1.4], 0.04, '#5a3a2a'));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(2.2, 3.2, -1.4), new THREE.Vector3(2.5, -0.35, -3.2)]), new THREE.LineBasicMaterial({ color: '#ffffff' })); scene.add(line);
  scene.add(K.at(K.sph(0.13, '#ff4a5a', { noOl: true }), 2.5, -0.32, -3.2));
  scene.add(K.at(K.mesh(new THREE.TorusGeometry(0.45, 0.025, 6, 32), '#d8f2ff', { noOl: true, cast: false }), 2.5, -0.38, -3.2, Math.PI / 2));
  [[-2.5, -2], [-1, -4.5], [4, -1], [5.5, -4]].forEach(([x, z]) => scene.add(K.at(K.cyl(0.55, 0.55, 0.05, '#5aa05a', { noOl: true, cast: false }), x, -0.37, z)));
  scene.add(K.at(K.sph(0.15, '#ffb0d0', { noOl: true }), -2.4, -0.25, -2));
  const r = rng(3); for (let i = 0; i < 14; i++) { const x = -5 + r() * 2, z = 0 + r() * 3; scene.add(K.limb([x, -0.4, z], [x + (r() - 0.5) * 0.3, 0.6 + r() * 0.8, z], 0.04, '#4a8a4a', { noOl: true })); }
  const lamp = K.group(K.at(K.cyl(0.05, 0.05, 1.4, '#3a2a2a'), 0, 0.7, 0), K.at(K.box(0.3, 0.38, 0.3, '#ffe0a0', { em: '#ffb050', ei: 1.4 }), 0, 1.55, 0)); K.at(lamp, -1.8, 0.1, 2.6); scene.add(lamp);
  const pl = new THREE.PointLight('#ffb050', 10, 6, 1.5); pl.position.set(-1.8, 1.7, 2.6); scene.add(pl);
  scene.add(K.at(K.cyl(0.16, 0.13, 0.3, '#e8eef8'), -0.4, 0.25, 3.2));
  const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 200); cam.position.set(-3.2, 3.6, 10.5); cam.lookAt(1.0, 1.1, 0.4);
  return { scene, cam, ui: 'chill' };
}

// ---------- UI overlays (one per genre, the same in every look) ----------
function ui(ctx, kind, look) {
  const px = look === 'pixel';
  const font = (w, s) => (px ? `${s}px "DejaVu Sans Mono"` : `${w} ${s}px Inter`);
  ctx.save(); ctx.scale(2, 2);
  if (kind === 'fight') {
    const bar = (x, w, fill, col, name, right) => {
      ctx.fillStyle = 'rgba(20,10,30,0.7)'; ctx.fillRect(x, 22, w, 14);
      ctx.fillStyle = col; ctx.fillRect(right ? x + w * (1 - fill) : x, 22, w * fill, 14);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(x, 22, w, 14);
      ctx.font = font(800, 11); ctx.fillStyle = '#fff'; ctx.textAlign = right ? 'right' : 'left'; ctx.fillText(name, right ? x + w : x, 50);
    };
    bar(14, 118, 0.72, '#ffd23a', 'FOX', false); bar(168, 118, 0.38, '#ffd23a', 'WOLF', true);
    ctx.font = font(900, 22); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('59', 150, 37);
    ctx.font = font(900, 30); ctx.fillStyle = '#ffe27a'; ctx.strokeStyle = '#3a1020'; ctx.lineWidth = 5; ctx.strokeText('COMBO x4!', 150, 440); ctx.fillText('COMBO x4!', 150, 440);
  } else if (kind === 'horror') {
    const v = ctx.createRadialGradient(150, 250, 90, 150, 270, 330); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    const r = rng(9); ctx.globalAlpha = 0.09; for (let i = 0; i < 1800; i++) { ctx.fillStyle = r() < 0.5 ? '#fff' : '#000'; ctx.fillRect(r() * W, r() * H, 1, 1); } ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(220,230,220,0.85)'; ctx.lineWidth = 1.5; ctx.strokeRect(18, 20, 40, 16); ctx.fillStyle = 'rgba(220,230,220,0.85)'; ctx.fillRect(58, 25, 3, 6);
    ctx.fillStyle = '#c84a3a'; ctx.fillRect(21, 23, 9, 10);
    ctx.font = font(500, 11); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(220,230,220,0.75)'; ctx.fillText('S O M E T H I N G   I S   H E R E', 150, 500);
  } else if (kind === 'race') {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2; const r = rng(4);
    for (let i = 0; i < 26; i++) { const a = r() * Math.PI * 2, d0 = 150 + r() * 60, d1 = d0 + 30 + r() * 50; const cx = 150, cy = 260; if (Math.abs(Math.sin(a)) < 0.3 && Math.cos(a) < 0) continue; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * d0, cy + Math.sin(a) * d0 * 1.3); ctx.lineTo(cx + Math.cos(a) * d1, cy + Math.sin(a) * d1 * 1.3); ctx.stroke(); }
    ctx.fillStyle = 'rgba(15,20,40,0.75)'; ctx.beginPath(); ctx.roundRect(14, 16, 92, 46, 10); ctx.fill();
    ctx.font = font(900, 26); ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'left'; ctx.fillText('2ND', 24, 49);
    ctx.font = font(700, 11); ctx.fillStyle = '#fff'; ctx.fillText('LAP 2/3', 72, 30);
    ctx.fillStyle = 'rgba(15,20,40,0.75)'; ctx.beginPath(); ctx.roundRect(206, 470, 80, 46, 10); ctx.fill();
    ctx.font = font(900, 26); ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.fillText('142', 262, 503); ctx.font = font(700, 9); ctx.fillText('KM/H', 280, 503);
  } else {
    ctx.fillStyle = 'rgba(255,248,236,0.82)'; ctx.beginPath(); ctx.roundRect(14, 16, 86, 32, 16); ctx.fill();
    ctx.font = font(800, 15); ctx.fillStyle = '#5a3a4a'; ctx.textAlign = 'left'; ctx.fillText('🐟 3 / 5', 26, 37);
    ctx.font = font(500, 11); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillText('wait for the bobber to dip…', 150, 505);
  }
  ctx.restore();
}

const SHOTS = {};
const out = document.createElement('canvas'); out.width = W * 2; out.height = H * 2; const octx = out.getContext('2d');
for (const look of ['toon', 'clay', 'lowpoly', 'pixel']) {
  const L = LOOKS[look];
  for (const [name, build] of [['fight', fighting], ['horror', horror], ['race', racing], ['chill', chill]]) {
    const K = kit(look);
    const { scene, cam, ui: kind } = build(K);
    renderer.toneMapping = L.tone; renderer.toneMappingExposure = L.exposure;
    if (L.pixel) { renderer.setPixelRatio(1); renderer.setSize(Math.round(W / 2.5), Math.round(H / 2.5), false); }
    else { renderer.setPixelRatio(2); renderer.setSize(W, H, false); }
    renderer.render(scene, cam);
    octx.imageSmoothingEnabled = !L.pixel;
    octx.clearRect(0, 0, out.width, out.height);
    octx.drawImage(gl, 0, 0, out.width, out.height);
    ui(octx, kind, look);
    SHOTS[`${look}-${name}`] = out.toDataURL('image/png');
  }
}
window.SHOTS = SHOTS;
document.body.dataset.ready = '1';
</script>
