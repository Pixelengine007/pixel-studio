<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Modern pixel art — four genres</title><style>body{margin:0;background:#111}</style></head>
<body>
<script>
'use strict';
// A tiny pixel renderer with real lighting: every pixel stores a colour ramp and a base shade;
// a lighting pass adds light from lamps, fire and candles, so light falls off in clean dithered steps.
const PW = 180, PH = 320, SCALE = 4;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)] / 16;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hash(x, y, s) { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); }

const RAMP = {
  night: ['#07081a', '#0d1130', '#141c48', '#1f2c66', '#2f4488', '#4a66b0'],
  dusk: ['#2a1640', '#4a2258', '#7a3366', '#b4506a', '#e8806a', '#ffc28a'],
  stone: ['#120e18', '#221c2c', '#382e42', '#54465c', '#766478', '#a08ca0'],
  wood: ['#140a0c', '#2c1616', '#4a2620', '#6e3c2a', '#985636', '#c27a48'],
  fur: ['#2a0c10', '#5a1a16', '#962e1c', '#d4542a', '#f2843c', '#ffb86a'],
  cream: ['#2e2228', '#5a464a', '#94807a', '#c8b4a0', '#eadcc4', '#fff8ea'],
  red: ['#1e0610', '#480c1c', '#86142a', '#c42636', '#ec5550', '#ff9284'],
  raven: ['#05040a', '#0e0a18', '#1a142a', '#2a2040', '#3e3258', '#5c4e7c'],
  gold: ['#3a1806', '#6e360a', '#aa6010', '#e29a1c', '#ffd23a', '#fff4a8'],
  pine: ['#050c0a', '#0a1a14', '#12281e', '#1c3a28', '#2a5034', '#3e6a42'],
  grass: ['#0c180c', '#16301a', '#244a22', '#386a2a', '#58902e', '#88b83c'],
  water: ['#040a18', '#08142c', '#0e2244', '#163460', '#244e84', '#4476ac'],
  fire: ['#6a1400', '#ac3200', '#e86200', '#ffa018', '#ffd84a', '#fff8c8'],
  asphalt: ['#0e0e16', '#1a1a24', '#262634', '#363646', '#4a4a5c', '#666678'],
  white: ['#262632', '#545468', '#9494a8', '#c6c6d6', '#e6e6f0', '#ffffff'],
  wall: ['#060a08', '#0e1610', '#162218', '#203024', '#2e4232', '#425a44'],
  blue: ['#08102e', '#10205c', '#1a3894', '#2856c8', '#4482ec', '#80b4ff'],
  steel: ['#0c1018', '#1a2230', '#2c3848', '#465468', '#6a7c92', '#a4b6c8'],
  teal: ['#04141a', '#082a30', '#0e464a', '#166a66', '#2a9488', '#5ac2ac'],
};
const RN = Object.keys(RAMP), RI = {}; RN.forEach((k, i) => { RI[k] = i; });
const RGB = RN.map((k) => RAMP[k].map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]));

function Engine() {
  const N = PW * PH, R = new Int16Array(N).fill(-1), S = new Float32Array(N), EM = new Uint8Array(N), ID = new Uint8Array(N);
  const lights = [], glows = [];
  let ambient = 0;
  const e = {
    lights, glows,
    setAmbient(a) { ambient = a; },
    put(x, y, ramp, sh, id = 0, em = 0) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= PW || y >= PH) return; const i = y * PW + x; R[i] = RI[ramp]; S[i] = sh; ID[i] = id; EM[i] = em; },
    get(x, y) { if (x < 0 || y < 0 || x >= PW || y >= PH) return null; return R[y * PW + x]; },
    // shapes. sh: a number, or a function (x, y, nx, ny) -> shade
    rect(x, y, w, h, ramp, sh, id = 0, em = 0) { for (let py = Math.round(y); py < Math.round(y + h); py++) for (let px = Math.round(x); px < Math.round(x + w); px++) e.put(px, py, ramp, typeof sh === 'function' ? sh(px, py, (px - x) / w, (py - y) / h) : sh, id, em); },
    ell(cx, cy, rx, ry, ramp, sh, id = 0, em = 0) {
      for (let py = Math.floor(cy - ry); py <= Math.ceil(cy + ry); py++) for (let px = Math.floor(cx - rx); px <= Math.ceil(cx + rx); px++) {
        const nx = (px + 0.5 - cx) / rx, ny = (py + 0.5 - cy) / ry; if (nx * nx + ny * ny > 1) continue;
        const s = sh === undefined ? 3 + Math.round((-nx * 0.55 - ny * 0.8) * 1.6) : typeof sh === 'function' ? sh(px, py, nx, ny) : sh;
        e.put(px, py, ramp, s, id, em);
      }
    },
    poly(pts, ramp, sh, id = 0, em = 0) {
      const ys = pts.map((p) => p[1]), xs = pts.map((p) => p[0]);
      for (let py = Math.floor(Math.min(...ys)); py <= Math.ceil(Math.max(...ys)); py++) for (let px = Math.floor(Math.min(...xs)); px <= Math.ceil(Math.max(...xs)); px++) {
        let c = false; const X = px + 0.5, Y = py + 0.5;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > Y) !== (yj > Y) && X < ((xj - xi) * (Y - yi)) / (yj - yi) + xi) c = !c; }
        if (c) e.put(px, py, ramp, typeof sh === 'function' ? sh(px, py) : sh, id, em);
      }
    },
    line(x0, y0, x1, y1, ramp, sh, t = 1, id = 0, em = 0) { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0))); for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; for (let a = 0; a < t; a++) for (let b = 0; b < t; b++) e.put(x + a - (t >> 1), y + b - (t >> 1), ramp, sh, id, em); } },
    outline(id) { // selective outline: each sprite's edge takes the darkest tone of its own colour
      const mark = [];
      for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) { const i = y * PW + x; if (ID[i] !== id) continue; const nb = (xx, yy) => (xx < 0 || yy < 0 || xx >= PW || yy >= PH ? 0 : ID[yy * PW + xx]); if (nb(x - 1, y) !== id || nb(x + 1, y) !== id || nb(x, y - 1) !== id || nb(x, y + 1) !== id) mark.push(i); }
      mark.forEach((i) => { S[i] = -9; EM[i] = 0; });
    },
    light(x, y, r, s, glow) { lights.push({ x, y, r, s }); if (glow) glows.push({ x, y, r: r * 1.1, col: glow, a: 0.22 }); },
    glow(x, y, r, col, a) { glows.push({ x, y, r, col, a }); },
    render(canvas) {
      const off = document.createElement('canvas'); off.width = PW; off.height = PH;
      const o = off.getContext('2d'), img = o.createImageData(PW, PH);
      for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
        const i = y * PW + x, k = i * 4;
        if (R[i] < 0) { img.data[k + 3] = 255; continue; }
        let sh = S[i];
        if (!EM[i] && sh > -9) {
          let L = 0; for (const l of lights) { const d = Math.hypot(x - l.x, y - l.y); if (d < l.r) L += l.s * Math.pow(1 - d / l.r, 1.4); }
          sh = sh + ambient + L;
          sh = Math.floor(sh + bay(x, y) * 0.999); // dithered light falloff
        }
        sh = sh <= -9 ? 0 : Math.max(0, Math.min(5, Math.round(sh)));
        const c = RGB[R[i]][sh]; img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
      }
      o.putImageData(img, 0, 0);
      const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.drawImage(off, 0, 0, PW * SCALE, PH * SCALE);
      // soft bloom on top (modern pixel games keep the pixels crisp but let light bleed)
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      glows.forEach((g) => { const X = g.x * SCALE, Y = g.y * SCALE, Rr = g.r * SCALE; const gr = ctx.createRadialGradient(X, Y, 0, X, Y, Rr); gr.addColorStop(0, g.col.replace('A', g.a)); gr.addColorStop(1, g.col.replace('A', 0)); ctx.fillStyle = gr; ctx.fillRect(X - Rr, Y - Rr, Rr * 2, Rr * 2); });
      ctx.restore();
    },
  };
  return e;
}

// 3x5 pixel font for the interface
const GL = { A: '111101111101101', B: '110101110101110', C: '111100100100111', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '111100101101111', H: '101101111101101', I: '111010010010111', K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '111101101101101', O: '111101101101111', P: '111101111100100', R: '111101110101101', S: '111100111001111', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101111010010', '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111', '/': '001001010100100', ':': '000010000010000', '!': '010010010000010', ' ': '000000000000000', '.': '000000000000010', 'x': '000101010101000' };
function text(ctx, str, x, y, k, col, shadow = '#0a0812', align = 'left') {
  const w = str.length * 4 * k - k; if (align === 'center') x -= w / 2; if (align === 'right') x -= w;
  const draw = (ox, oy, c) => { ctx.fillStyle = c; [...str].forEach((ch, n) => { const g = GL[ch] || GL[' ']; for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r * 3 + q] === '1') ctx.fillRect(x + ox + (n * 4 + q) * k, y + oy + r * k, k, k); }); };
  if (shadow) { draw(k, k, shadow); }
  draw(0, 0, col);
}

// ---------- characters ----------
// Ember: a small fox adventurer with a red scarf. Side view, facing right; (x, y) = feet.
function ember(e, x, y, s, id, pose = 'stand', flip = 1) {
  const P = (dx, dy) => [x + dx * s * flip, y + dy * s];
  const E = (dx, dy, rx, ry, ramp, sh) => { const [cx, cy] = P(dx, dy); e.ell(cx, cy, rx * s, ry * s, ramp, sh, id); };
  const L = (x0, y0, x1, y1, ramp, sh, t) => { const a = P(x0, y0), b = P(x1, y1); e.line(a[0], a[1], b[0], b[1], ramp, sh, Math.max(1, Math.round(t * s)), id); };
  const T = (pts, ramp, sh) => e.poly(pts.map(([a, b]) => P(a, b)), ramp, sh, id);
  // tail
  E(-9, -11, 6, 3.6, 'fur'); E(-13.5, -13, 2.6, 2.2, 'cream');
  // far legs
  if (pose === 'sit') { L(0, -6, 6, -4, 'fur', 1, 2); } else { L(-3, -6, pose === 'lunge' ? -7 : -4, 0, 'fur', 1, 2); L(3, -6, pose === 'lunge' ? 8 : 4, 0, 'fur', 1, 2); }
  E(0, -10, 6.5, 5, 'fur'); E(2.5, -8.5, 3.2, 3, 'cream', 4);
  // near legs and paws
  if (pose === 'sit') { L(1, -5, 8, -2, 'fur', 2, 2); E(8.5, -2, 1.6, 1.2, 'raven', 2); }
  else { L(-2, -6, pose === 'lunge' ? -9 : -2, 0, 'fur', 2, 2); L(4, -6, pose === 'lunge' ? 10 : 5, 0, 'fur', 2, 2); E(pose === 'lunge' ? -9 : -2, 0, 1.7, 1, 'raven', 2); E(pose === 'lunge' ? 10.5 : 5.5, 0, 1.7, 1, 'raven', 2); }
  // head
  E(5, -18, 5, 4.6, 'fur');
  T([[8, -20], [14, -17.5], [13.5, -16], [8, -15]], 'cream', 4);
  e.put(...P(13.8, -17), 'raven', 0, id);
  T([[1.5, -21], [2.5, -27], [5.5, -21.5]], 'fur', 3); T([[5, -22], [7.5, -27.5], [9, -21.5]], 'fur', 2);
  e.put(...P(3.2, -23.5), 'raven', 1, id); e.put(...P(7.2, -24), 'raven', 1, id);
  e.put(...P(8, -19), 'raven', 0, id);
  // scarf, with its ends flying back
  T([[-0.5, -15.5], [7, -15.5], [7.5, -13], [0, -12.5]], 'red', 3);
  T([[0, -15], [-8, -17], [-11, -14.5], [-5, -14], [0, -12.5]], 'red', 2);
  e.outline(id);
}
// Corvus: a raven duellist in a ragged cloak. Faces left.
function corvus(e, x, y, s, id) {
  const P = (dx, dy) => [x - dx * s, y + dy * s];
  const T = (pts, ramp, sh) => e.poly(pts.map(([a, b]) => P(a, b)), ramp, sh, id);
  const E = (dx, dy, rx, ry, ramp, sh) => { const [cx, cy] = P(dx, dy); e.ell(cx, cy, rx * s, ry * s, ramp, sh, id); };
  T([[-7, -26], [7, -24], [9, -8], [11, 0], [-11, 0], [-8, -6]], 'raven', (px, py) => 2 + Math.round(hash(px, py, 3) * 0.6));
  for (let i = 0; i < 6; i++) T([[-11 + i * 4, 0], [-9 + i * 4, 4 + (i % 2) * 2], [-7 + i * 4, 0]], 'raven', 1);
  E(0, -29, 6, 5.5, 'raven'); T([[4, -31], [13, -28], [4, -26]], 'gold', 4);
  T([[-3, -33], [-9, -36], [-4, -31]], 'raven', 2);
  e.put(...P(2, -30), 'red', 5, id, 1); e.put(...P(2.5, -30), 'red', 5, id, 1);
  T([[2, -20], [12, -15], [11, -13], [1, -17]], 'raven', 3);
  e.outline(id);
}

// ---------- scenes ----------
function sceneFight(e) {
  e.setAmbient(-1);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) { const t = y / 200; e.put(x, y, 'night', Math.min(5, Math.floor(t * 5 + bay(x, y) * 0.9)) ); }
  const r = rng(3); for (let i = 0; i < 60; i++) e.put(r() * PW, r() * 150, 'white', 3 + Math.floor(r() * 3), 0, 1);
  e.ell(128, 92, 30, 30, 'cream', (px, py, nx, ny) => (hash(px >> 2, py >> 2, 1) < 0.12 ? 3 : 5), 0, 1);
  e.glow(128, 92, 80, 'rgba(200,210,255,A)', 0.25);
  // mountains and mist
  for (let x = 0; x < PW; x++) { const h = 150 + Math.sin(x * 0.05) * 14 + Math.sin(x * 0.13 + 1) * 6; for (let y = Math.floor(h); y < 230; y++) e.put(x, y, 'stone', y < h + 2 ? 3 : 1); }
  for (let x = 0; x < PW; x++) { const h = 178 + Math.sin(x * 0.08 + 2) * 10; for (let y = Math.floor(h); y < 240; y++) e.put(x, y, 'raven', y < h + 1 ? 3 : 2); }
  for (let y = 200; y < 236; y++) for (let x = 0; x < PW; x++) if (bay(x, y) < (y - 200) / 36 * 0.8) e.put(x, y, 'night', 3);
  // the bridge: planks, posts, ropes, hanging lanterns
  for (let x = 0; x < PW; x += 6) e.rect(x, 236, 5, 10, 'wood', (px, py) => (py === 236 ? 4 : 2 + (hash(x, 0, 1) < 0.3 ? -1 : 0)));
  e.rect(0, 246, PW, 4, 'wood', 1);
  for (let y = 250; y < PH; y++) for (let x = 0; x < PW; x++) e.put(x, y, 'night', y > 300 ? 0 : 1);
  [8, 64, 120, 172].forEach((px) => { e.rect(px - 2, 206, 4, 30, 'wood', 3); e.rect(px - 3, 204, 6, 3, 'wood', 4); });
  for (let x = 0; x < PW; x++) { const y = 212 + Math.round(Math.sin(((x % 56) / 56) * Math.PI) * 6); e.put(x, y, 'wood', 4); }
  [[36, 222], [148, 222]].forEach(([lx, ly]) => { e.line(lx, 214, lx, ly - 4, 'stone', 2); e.rect(lx - 3, ly - 4, 6, 8, 'fire', 4, 0, 1); e.rect(lx - 3, ly - 5, 6, 1, 'wood', 1); e.light(lx, ly, 46, 2.4, 'rgba(255,160,60,A)'); });
  // fighters mid-clash
  ember(e, 46, 236, 2.6, 1, 'lunge');
  corvus(e, 140, 236, 2.0, 2);
  // blades and the clash
  e.line(70, 186, 100, 172, 'white', 5, 2, 0, 1); e.line(106, 170, 112, 204, 'steel', 4, 2, 0, 1);
  for (let a = 0; a < 26; a++) { const t = a / 25; for (let k = 0; k < 3; k++) e.put(56 + Math.cos(-2.4 + t * 2) * (40 - k), 206 + Math.sin(-2.4 + t * 2) * (40 - k), k ? 'teal' : 'white', 5 - (k > 1 ? 1 : 0), 0, 1); }
  for (let i = 0; i < 18; i++) { const a = r() * 6.28, d = 3 + r() * 16; e.put(103 + Math.cos(a) * d, 172 + Math.sin(a) * d, 'gold', 4 + Math.floor(r() * 2), 0, 1); }
  e.light(103, 172, 44, 2.8, 'rgba(255,230,150,A)'); e.glow(103, 172, 24, 'rgba(255,250,220,A)', 0.6);
  // drifting petals
  for (let i = 0; i < 18; i++) e.rect(r() * PW, 120 + r() * 120, 2, 1, 'red', 5, 0, 1);
  return (ctx) => {
    const bar = (x, w, f, right) => { ctx.fillStyle = '#0a0812'; ctx.fillRect(x - 4, 36, w + 8, 28); ctx.fillStyle = '#3a1020'; ctx.fillRect(x, 40, w, 20); ctx.fillStyle = '#ff5050'; ctx.fillRect(right ? x + w * (1 - f) : x, 40, w * f, 20); ctx.fillStyle = '#ffd23a'; ctx.fillRect(right ? x + w * (1 - f) : x, 40, w * f, 6); };
    bar(24, 260, 0.7, false); bar(436, 260, 0.35, true);
    text(ctx, 'EMBER', 24, 76, 4, '#fff4d0'); text(ctx, 'CORVUS', 696, 76, 4, '#fff4d0', '#0a0812', 'right');
    text(ctx, '47', 360, 30, 8, '#ffffff', '#0a0812', 'center');
    text(ctx, 'COUNTER!', 360, 1080, 9, '#ffd23a', '#3a1020', 'center');
  };
}

function sceneHorror(e) {
  e.setAmbient(-3);
  // a long hallway in one-point perspective
  const vx = 92, vy = 150, bw = 34, bh = 44; // back wall
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const inBack = Math.abs(x - vx) < bw && y > vy - bh && y < vy + bh * 0.9;
    if (inBack) { e.put(x, y, 'wall', 2); continue; }
    const dx = (x - vx) / (PW / 2), dy = (y - vy) / (PH / 2);
    if (y >= vy + bh * 0.9 && Math.abs(dx) < (y - vy) / (PH - vy) * 1.6 + 0.4) { // floor planks
      const depth = (y - vy) / (PH - vy), u = (x - vx) / (depth * 180 + 1);
      const seam = Math.abs((u * 6) % 1) < 0.08 || Math.abs((1 / depth) * 3 % 1) < 0.06 * depth;
      e.put(x, y, 'wood', seam ? 1 : 2 + (hash(Math.floor(u * 6), 0, 2) < 0.4 ? 0 : 1)); continue;
    }
    if (y <= vy - bh) { e.put(x, y, 'raven', 1); continue; }
    const stripe = Math.floor((x - vx) / (Math.abs(x - vx) * 0.12 + 2)) % 2 === 0;
    e.put(x, y, 'wall', stripe ? 3 : 2 + (hash(x >> 2, y >> 3, 4) < 0.08 ? -1 : 0));
  }
  // the open door at the end, and what stands in it
  e.rect(vx - 12, vy - 30, 24, 60, 'raven', 0);
  e.rect(vx - 14, vy - 32, 28, 2, 'wood', 2); e.rect(vx - 14, vy - 32, 2, 64, 'wood', 2); e.rect(vx + 12, vy - 32, 2, 64, 'wood', 2);
  e.poly([[vx - 5, vy + 30], [vx - 4, vy - 16], [vx - 6, vy - 22], [vx, vy - 27], [vx + 6, vy - 22], [vx + 4, vy - 16], [vx + 5, vy + 30]], 'raven', 1, 3);
  e.line(vx - 4, vy - 12, vx - 11, vy + 8, 'raven', 1, 1, 3); e.line(vx + 4, vy - 12, vx + 10, vy + 10, 'raven', 1, 1, 3);
  e.put(vx - 2, vy - 22, 'white', 5, 0, 1); e.put(vx + 2, vy - 22, 'white', 5, 0, 1);
  e.glow(vx, vy - 22, 6, 'rgba(230,240,255,A)', 0.5);
  // crooked frames and scratches on the walls
  e.rect(22, 120, 22, 28, 'wood', 2); e.rect(25, 123, 16, 22, 'stone', 1);
  e.rect(140, 128, 18, 22, 'wood', 2); e.rect(143, 131, 12, 16, 'red', 1);
  for (let i = 0; i < 4; i++) e.line(150 + i * 3, 178, 146 + i * 3, 198, 'cream', 1);
  // the little fox with a candle
  ember(e, 74, 300, 2.0, 1, 'stand');
  e.rect(108, 262, 4, 10, 'cream', 4, 0, 1); e.ell(110, 258, 2, 3.5, 'fire', 4, 0, 1); e.put(110, 256, 'fire', 5, 0, 1);
  e.line(103, 270, 108, 268, 'fur', 3, 2);
  e.light(110, 258, 120, 5.2, 'rgba(255,170,80,A)'); e.glow(110, 258, 10, 'rgba(255,230,160,A)', 0.8);
  e.light(vx, vy - 22, 10, 1.5);
  // dust in the candlelight
  const r = rng(8); for (let i = 0; i < 26; i++) { const a = r() * 6.28, d = 10 + r() * 60; e.put(110 + Math.cos(a) * d, 258 + Math.sin(a) * d * 0.8, 'cream', 3); }
  return (ctx) => {
    for (let i = 0; i < 5; i++) { ctx.fillStyle = i < 1 ? '#ff6a4a' : '#3a2a2a'; ctx.fillRect(28 + i * 26, 36, 18, 30); }
    ctx.strokeStyle = '#c8b8a8'; ctx.lineWidth = 4; ctx.strokeRect(22, 30, 140, 42);
    text(ctx, 'DONT LOOK BACK', 360, 1180, 5, '#c8b8a8', '#000', 'center');
  };
}

function sceneRace(e) {
  e.setAmbient(0);
  const hy = 132;
  for (let y = 0; y < hy; y++) for (let x = 0; x < PW; x++) e.put(x, y, 'dusk', Math.max(0, Math.min(5, Math.floor((y / hy) * 6 + bay(x, y) * 0.95))));
  e.ell(118, 108, 26, 26, 'gold', (px, py) => ((py - 82) % 6 < 2 && py > 104 ? 3 : 5), 0, 1);
  e.glow(118, 108, 70, 'rgba(255,180,110,A)', 0.35);
  for (let x = 0; x < PW; x++) { const h = hy - 14 - Math.abs(Math.sin(x * 0.04)) * 18 - (hash(x >> 3, 0, 5) * 6); for (let y = Math.floor(h); y < hy; y++) e.put(x, y, 'dusk', 1); }
  for (let x = 0; x < PW; x += 1) { const b = Math.floor(x / 7); const h = hy - 6 - Math.floor(hash(b, 1, 6) * 16); if (hash(b, 2, 6) < 0.6) for (let y = h; y < hy; y++) e.put(x, y, 'raven', 3); if (hash(x, b, 7) < 0.06) e.put(x, h + 3, 'gold', 5, 0, 1); }
  // pseudo-3D road, row by row
  const pos = 3.7, curve = 0.9;
  for (let y = hy; y < PH; y++) {
    const p = (y - hy) / (PH - hy), z = 1 / (p + 0.02);
    const cx = 90 + curve * (1 - p) * (1 - p) * 70 - p * 8, half = 8 + p * 112, rum = half * 0.12;
    const seg = Math.floor(z * 1.6 + pos) % 2;
    for (let x = 0; x < PW; x++) {
      const d = Math.abs(x - cx);
      if (d < half) { const lane = d < half * 0.03 && seg; e.put(x, y, lane ? 'white' : 'asphalt', lane ? 5 : seg ? 2 : 3); }
      else if (d < half + rum) e.put(x, y, seg ? 'red' : 'white', seg ? 3 : 4);
      else e.put(x, y, 'grass', seg ? 3 : 2);
    }
  }
  // roadside trees and signs at different depths
  const side = (zp, sideSign, kind) => {
    const p = zp, y = hy + p * (PH - hy), cx = 90 + curve * (1 - p) * (1 - p) * 70 - p * 8, half = 8 + p * 112;
    const x = cx + sideSign * (half + 14 + p * 40), s = 0.3 + p * 1.4;
    if (kind === 'tree') { e.rect(x - 1.5 * s, y - 10 * s, 3 * s, 10 * s, 'wood', 2); e.poly([[x, y - 34 * s], [x - 10 * s, y - 8 * s], [x + 10 * s, y - 8 * s]], 'pine', (px) => (px < x ? 3 : 2)); }
    else { e.rect(x - 1 * s, y - 16 * s, 2 * s, 16 * s, 'steel', 2); e.rect(x - 9 * s, y - 24 * s, 18 * s, 10 * s, 'blue', 3); e.rect(x - 7 * s, y - 21 * s, 14 * s, 2 * s, 'white', 5); }
  };
  [[0.08, 1, 'tree'], [0.12, -1, 'tree'], [0.2, 1, 'sign'], [0.26, -1, 'tree'], [0.42, 1, 'tree'], [0.5, -1, 'tree'], [0.75, 1, 'tree'], [0.85, -1, 'tree']].forEach(([p, sg, k]) => side(p, sg, k));
  // rival car ahead (small) and our car (big, from behind)
  const car = (cx, cy, s, body, id, driver) => {
    e.rect(cx - 16 * s, cy - 6 * s, 32 * s, 8 * s, body, (px, py, u, v) => (v < 0.3 ? 4 : 2), id);
    e.poly([[cx - 11 * s, cy - 6 * s], [cx - 8 * s, cy - 13 * s], [cx + 8 * s, cy - 13 * s], [cx + 11 * s, cy - 6 * s]], body, 3, id);
    e.rect(cx - 7 * s, cy - 12 * s, 14 * s, 5 * s, 'blue', 4, id);
    e.rect(cx - 18 * s, cy + 1 * s, 7 * s, 6 * s, 'asphalt', 1, id); e.rect(cx + 11 * s, cy + 1 * s, 7 * s, 6 * s, 'asphalt', 1, id);
    e.rect(cx - 14 * s, cy - 4 * s, 5 * s, 2 * s, 'red', 5, id, 1); e.rect(cx + 9 * s, cy - 4 * s, 5 * s, 2 * s, 'red', 5, id, 1);
    if (driver) { e.ell(cx, cy - 17 * s, 5 * s, 4.5 * s, 'fur', undefined, id); e.poly([[cx - 4 * s, cy - 19 * s], [cx - 3 * s, cy - 26 * s], [cx - 1 * s, cy - 20 * s]], 'fur', 3, id); e.poly([[cx + 1 * s, cy - 20 * s], [cx + 3 * s, cy - 26 * s], [cx + 4 * s, cy - 19 * s]], 'fur', 2, id); e.rect(cx - 5 * s, cy - 14 * s, 10 * s, 2 * s, 'red', 3, id); }
    e.outline(id);
  };
  car(112, 168, 0.55, 'blue', 2, false);
  car(86, 292, 1.9, 'red', 1, true);
  e.glow(86 - 21, 292 - 6, 12, 'rgba(255,60,60,A)', 0.5); e.glow(86 + 22, 292 - 6, 12, 'rgba(255,60,60,A)', 0.5);
  return (ctx) => {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 4; const r = rng(2);
    for (let i = 0; i < 18; i++) { const side2 = r() < 0.5 ? -1 : 1, y = 600 + r() * 600, x = side2 < 0 ? r() * 140 : 580 + r() * 140; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + side2 * 40, y + 60); ctx.stroke(); }
    text(ctx, '2ND', 28, 32, 10, '#ffd23a'); text(ctx, 'LAP 2/3', 32, 100, 4, '#ffffff');
    text(ctx, '0:41.7', 692, 36, 5, '#ffffff', '#0a0812', 'right');
    text(ctx, '186', 692, 1180, 9, '#ffffff', '#0a0812', 'right'); text(ctx, 'KMH', 692, 1236, 4, '#ffd23a', '#0a0812', 'right');
  };
}

function sceneChill(e) {
  e.setAmbient(-2);
  for (let y = 0; y < 190; y++) for (let x = 0; x < PW; x++) e.put(x, y, 'night', Math.max(0, Math.min(5, Math.floor(1 + (y / 190) * 3 + bay(x, y) * 0.9))));
  // a soft aurora ribbon
  for (let x = 0; x < PW; x++) { const c = 70 + Math.sin(x * 0.05) * 16 + Math.sin(x * 0.11) * 6; for (let y = c - 16; y < c + 16; y++) if (bay(x, Math.round(y)) < 1 - Math.abs(y - c) / 16) e.put(x, y, 'teal', 4 + (Math.abs(y - c) < 4 ? 1 : 0), 0, 1); }
  const r = rng(12); for (let i = 0; i < 70; i++) e.put(r() * PW, r() * 180, 'white', 4 + Math.floor(r() * 2), 0, 1);
  // pine silhouettes across the lake
  for (let i = 0; i < 26; i++) { const x = i * 7 + r() * 4, h = 18 + r() * 26; e.poly([[x, 190 - h], [x - 6, 190], [x + 6, 190]], 'pine', 1); }
  // lake with star reflections
  for (let y = 190; y < 236; y++) for (let x = 0; x < PW; x++) e.put(x, y, 'water', 2 + (Math.sin(x * 0.4 + y * 1.3) > 0.85 ? 1 : 0));
  for (let x = 0; x < PW; x++) { const c = 210 + Math.sin(x * 0.05) * 5; if (hash(x, 0, 9) < 0.5) e.put(x, c + (x % 3), 'teal', 4, 0, 1); }
  for (let i = 0; i < 24; i++) e.put(r() * PW, 194 + r() * 40, 'white', 3, 0, 1);
  // grassy shore
  for (let y = 236; y < PH; y++) for (let x = 0; x < PW; x++) e.put(x, y, 'grass', 2 + (hash(x >> 1, y >> 1, 2) < 0.2 ? 1 : 0));
  for (let i = 0; i < 80; i++) { const x = r() * PW, y = 240 + r() * 80; e.line(x, y, x + (r() - 0.5) * 2, y - 2 - r() * 3, 'grass', 4); }
  // tent
  e.poly([[118, 286], [146, 238], [174, 286]], 'cream', (px) => (px < 146 ? 4 : 2), 4); e.poly([[140, 286], [146, 254], [152, 286]], 'raven', 1, 4); e.outline(4);
  // campfire: stones, logs, flames
  [[-9, 2], [-5, 4], [0, 5], [5, 4], [9, 2]].forEach(([dx, dy]) => e.ell(78 + dx, 294 + dy, 3, 2, 'stone'));
  e.line(70, 292, 86, 288, 'wood', 2, 3); e.line(70, 288, 86, 292, 'wood', 3, 3);
  e.poly([[72, 290], [76, 270], [79, 280], [82, 262], [85, 282], [88, 290]], 'fire', (px, py) => (py < 274 ? 5 : py < 282 ? 4 : 3), 0, 1);
  e.poly([[76, 290], [79, 278], [82, 284], [84, 290]], 'fire', 5, 0, 1);
  e.light(80, 280, 110, 4.6, 'rgba(255,150,60,A)'); e.glow(80, 278, 16, 'rgba(255,230,160,A)', 0.7);
  for (let i = 0; i < 10; i++) e.put(74 + r() * 14, 230 + r() * 30, 'fire', 4, 0, 1);
  // log seat and Ember toasting a marshmallow
  e.rect(14, 292, 40, 9, 'wood', (px, py, u, v) => (v < 0.3 ? 4 : 2), 5); e.ell(14, 296, 3, 4.5, 'wood', 4, 5); e.outline(5);
  ember(e, 26, 292, 1.5, 1, 'sit');
  e.line(44, 266, 70, 258, 'wood', 3, 1); e.ell(71, 257, 2.4, 2, 'cream', 5);
  // fireflies over the grass
  for (let i = 0; i < 9; i++) { const x = 10 + r() * 160, y = 236 + r() * 50; e.put(x, y, 'gold', 5, 0, 1); e.glow(x, y, 5, 'rgba(255,240,140,A)', 0.6); }
  return (ctx) => {
    ctx.fillStyle = 'rgba(10,8,18,0.6)'; ctx.fillRect(24, 28, 180, 56);
    text(ctx, 'NIGHT 3', 40, 40, 5, '#eadcc4');
    text(ctx, 'TAP TO ROAST', 360, 1200, 5, '#eadcc4', '#0a0812', 'center');
  };
}

const SHOTS = {};
[['fight', sceneFight], ['horror', sceneHorror], ['race', sceneRace], ['chill', sceneChill]].forEach(([name, fn]) => {
  const e = Engine(), ui = fn(e);
  const c = document.createElement('canvas'); c.width = PW * SCALE; c.height = PH * SCALE;
  e.render(c); const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; ui(ctx);
  SHOTS[`pixel-${name}`] = c.toDataURL('image/png');
});
window.SHOTS = SHOTS; document.body.dataset.ready = '1';
</script>
